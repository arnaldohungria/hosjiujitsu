<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil - HOS Jiu-Jitsu</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Logo">
    <h1 id="saudacao">Área do Aluno</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main">
  <nav class="app-nav">
    <a href="perfil.html" class="active">Meus Dados</a>
    <a href="conteudos.html">Conteúdos</a>
  </nav>

  <div class="card">
    <h2>Dados do aluno</h2>
    <div id="perfil-aluno">
      <p style="color:var(--text-dim);">Carregando...</p>
    </div>
  </div>

  <div class="card">
    <h2>Dados do responsável</h2>
    <div id="perfil-responsavel"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const saudacao = document.getElementById("saudacao");
const perfilAluno = document.getElementById("perfil-aluno");
const perfilResponsavel = document.getElementById("perfil-responsavel");

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));

// Nunca usar innerHTML com dados do aluno/responsável (conteúdo livre, digitado
// por eles) — cada linha é montada via createElement/textContent, que escapam
// qualquer HTML/script automaticamente.
function linha(container, label, valor) {
  const row = document.createElement("div");
  row.className = "profile-row";
  const spanLabel = document.createElement("span");
  spanLabel.className = "label";
  spanLabel.textContent = label;
  const spanValue = document.createElement("span");
  spanValue.className = "value";
  spanValue.textContent = valor;
  row.append(spanLabel, spanValue);
  container.appendChild(row);
}

function formatarData(iso) {
  if (!iso) return "-";
  const [ano, mes, dia] = iso.split("-");
  return dia + "/" + mes + "/" + ano;
}

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("alunos").doc(user.uid).get();
  if (!doc.exists) {
    perfilAluno.textContent = "Cadastro não encontrado.";
    return;
  }

  const aluno = doc.data();
  saudacao.textContent = "Olá, " + aluno.nomeCompleto.split(" ")[0];

  perfilAluno.innerHTML = "";
  linha(perfilAluno, "Nome completo", aluno.nomeCompleto);
  linha(perfilAluno, "Data de nascimento", formatarData(aluno.dataNascimento));
  linha(perfilAluno, "RG ou CPF", aluno.documentoAluno || "-");
  linha(perfilAluno, "Telefone", aluno.telefoneAluno || "-");

  const rowFaixa = document.createElement("div");
  rowFaixa.className = "profile-row";
  const labelFaixa = document.createElement("span");
  labelFaixa.className = "label";
  labelFaixa.textContent = "Faixa";
  const beltTag = document.createElement("span");
  beltTag.className = "belt-tag";
  beltTag.textContent = aluno.faixa;
  rowFaixa.append(labelFaixa, beltTag);
  perfilAluno.appendChild(rowFaixa);

  linha(perfilAluno, "E-mail", aluno.email);

  perfilResponsavel.innerHTML = "";
  linha(perfilResponsavel, "Nome completo", aluno.nomeResponsavel || "-");
  linha(perfilResponsavel, "RG ou CPF", aluno.documentoResponsavel || "-");
  linha(perfilResponsavel, "Endereço", aluno.enderecoResponsavel);
  linha(perfilResponsavel, "Telefone", aluno.telefoneResponsavel || "-");
});
</script>
</body>
</html>
