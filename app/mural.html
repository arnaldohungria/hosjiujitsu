<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural de Avisos - HOS Jiu-Jitsu</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Logo">
    <h1 id="saudacao">Área do Aluno</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main">
  <nav class="app-nav">
    <a href="mural.html" class="active">Mural</a>
    <a href="perfil.html">Meus Dados</a>
    <a href="conteudos.html">Conteúdos</a>
  </nav>

  <div class="card">
    <h2>Avisos</h2>
    <div id="lista-avisos">
      <p style="color:var(--text-dim);">Carregando...</p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const saudacao = document.getElementById("saudacao");
const listaAvisos = document.getElementById("lista-avisos");

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));

function formatarDataHora(date) {
  return date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

// Título/mensagem vêm do professor via admin-mural.html — mesmo assim, nunca usar
// innerHTML: sempre createElement/textContent, escapando qualquer HTML/script.
function renderizarAvisos(snap) {
  if (snap.empty) {
    listaAvisos.innerHTML = "";
    const p = document.createElement("p");
    p.style.color = "var(--text-dim)";
    p.textContent = "Nenhum aviso publicado ainda.";
    listaAvisos.appendChild(p);
    return;
  }

  listaAvisos.innerHTML = "";
  snap.forEach((doc) => {
    const aviso = doc.data();
    const card = document.createElement("div");
    card.className = "aviso-card";

    const titulo = document.createElement("h3");
    titulo.textContent = aviso.titulo;

    const data = document.createElement("span");
    data.className = "aviso-data";
    data.textContent = aviso.criadoEm ? formatarDataHora(aviso.criadoEm.toDate()) : "";

    const mensagem = document.createElement("p");
    mensagem.className = "aviso-mensagem";
    mensagem.textContent = aviso.mensagem;

    card.append(titulo, data, mensagem);
    listaAvisos.appendChild(card);
  });
}

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("alunos").doc(user.uid).get();
  if (doc.exists) {
    saudacao.textContent = "Olá, " + doc.data().nomeCompleto.split(" ")[0];
  }

  db.collection("avisos").orderBy("criadoEm", "desc").onSnapshot(renderizarAvisos, () => {
    listaAvisos.innerHTML = "";
    const p = document.createElement("p");
    p.style.color = "var(--text-dim)";
    p.textContent = "Não foi possível carregar os avisos.";
    listaAvisos.appendChild(p);
  });
});
</script>
</body>
</html>
