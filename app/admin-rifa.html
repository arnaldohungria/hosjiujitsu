<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa - Painel do Professor - HOS Jiu-Jitsu</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Logo">
    <h1>Rifa &mdash; Painel do Professor</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main wide">
  <div class="card" id="card-negado" style="display:none;">
    <h2>Acesso restrito</h2>
    <p>Esta área é exclusiva para o professor.</p>
  </div>

  <div id="conteudo" style="display:none;">
    <div class="card-header-row" style="margin-top:0;">
      <a href="admin.html" class="btn-secundario">&larr; Alunos</a>
      <a href="admin-doacoes.html" class="btn-secundario">Doações</a>
    </div>

    <div class="card">
      <h2>Cartela (200 números)</h2>
      <div class="rifa-legenda">
        <span><i class="rifa-dot disponivel"></i> Disponível</span>
        <span><i class="rifa-dot reservado"></i> Reservado</span>
        <span><i class="rifa-dot pago"></i> Vendido</span>
      </div>
      <div class="rifa-grid" id="rifaGrid" style="max-width:none;"></div>
    </div>

    <div class="card">
      <div class="card-header-row">
        <h2>Pedidos</h2>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="tabela-pedidos">
          <thead>
            <tr><th>Comprador</th><th>Telefone</th><th>Números</th><th>Valor</th><th>Status</th><th>Criado em</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="6">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const cardNegado = document.getElementById("card-negado");
const conteudo = document.getElementById("conteudo");
const rifaGrid = document.getElementById("rifaGrid");
const tabelaPedidos = document.querySelector("#tabela-pedidos tbody");

const TOTAL_NUMEROS = 200;

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const adminDoc = await db.collection("admins").doc(user.uid).get();
  if (!adminDoc.exists) {
    cardNegado.style.display = "block";
    return;
  }

  conteudo.style.display = "block";
  iniciarGrid();
  iniciarPedidos();
});

function formatarNumero(n) {
  return String(n).padStart(3, "0");
}

function iniciarGrid() {
  for (let n = 1; n <= TOTAL_NUMEROS; n++) {
    const tile = document.createElement("div");
    tile.className = "rifa-numero";
    tile.textContent = formatarNumero(n);
    tile.style.cursor = "default";
    rifaGrid.appendChild(tile);
  }

  db.collection("rifaNumeros").onSnapshot((snap) => {
    snap.docChanges().forEach((change) => {
      const numero = change.doc.data().numero;
      const tile = rifaGrid.children[numero - 1];
      tile.classList.remove("reservado", "pago");
      if (change.type !== "removed") {
        tile.classList.add(change.doc.data().status);
      }
    });
  });
}

function formatarValor(v) {
  return "R$ " + (v || 0).toFixed(2).replace(".", ",");
}

function formatarDataHora(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleString("pt-BR");
}

const STATUS_LABEL = { pendente: "Pendente", pago: "Pago", expirado: "Expirado" };

function iniciarPedidos() {
  db.collection("rifaPedidos").orderBy("criadoEm", "desc").onSnapshot((snap) => {
    if (snap.empty) {
      tabelaPedidos.innerHTML = "<tr><td colspan='6'>Nenhum pedido ainda.</td></tr>";
      return;
    }

    tabelaPedidos.innerHTML = "";

    // Nome e telefone vêm de um formulário público sem cadastro (conteúdo livre)
    // — nunca usar innerHTML com esses dados, sempre createElement/textContent.
    snap.forEach((doc) => {
      const pedido = doc.data();
      const tr = document.createElement("tr");

      const tdNome = document.createElement("td");
      tdNome.textContent = pedido.nomeComprador;

      const tdTelefone = document.createElement("td");
      tdTelefone.textContent = pedido.telefoneComprador;

      const tdNumeros = document.createElement("td");
      tdNumeros.textContent = (pedido.numeros || []).map(formatarNumero).join(", ");

      const tdValor = document.createElement("td");
      tdValor.textContent = formatarValor(pedido.valorTotal);

      const tdStatus = document.createElement("td");
      const statusTag = document.createElement("span");
      statusTag.className = "pedido-tag " + pedido.status;
      statusTag.textContent = STATUS_LABEL[pedido.status] || pedido.status;
      tdStatus.appendChild(statusTag);

      const tdCriado = document.createElement("td");
      tdCriado.textContent = pedido.criadoEm ? formatarDataHora(pedido.criadoEm.toDate()) : "-";

      tr.append(tdNome, tdTelefone, tdNumeros, tdValor, tdStatus, tdCriado);
      tabelaPedidos.appendChild(tr);
    });
  });
}
</script>
</body>
</html>
