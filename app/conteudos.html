<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteúdos - HOS Jiu-Jitsu</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Logo">
    <h1 id="saudacao">Área do Aluno</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main">
  <nav class="app-nav">
    <a href="perfil.html">Meus Dados</a>
    <a href="conteudos.html" class="active">Conteúdos</a>
  </nav>

  <div class="card">
    <h2>Conteúdos</h2>
    <div class="em-breve">
      <div class="icone">🎥</div>
      <p><strong>Em breve.</strong></p>
      <p>Video-aulas e outros materiais exclusivos pra alunos vão aparecer aqui.</p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const saudacao = document.getElementById("saudacao");

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("alunos").doc(user.uid).get();
  if (doc.exists) {
    saudacao.textContent = "Olá, " + doc.data().nomeCompleto.split(" ")[0];
  }
});
</script>
</body>
</html>
