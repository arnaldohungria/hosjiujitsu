<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Professor - HOS Jiu-Jitsu</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Logo">
    <h1>Painel do Professor</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main wide">
  <div class="card" id="card-negado" style="display:none;">
    <h2>Acesso restrito</h2>
    <p>Esta área é exclusiva para o professor. Se você deveria ter acesso, peça para liberar seu usuário na coleção <code>admins</code> do Firebase.</p>
  </div>

  <div id="conteudo" style="display:none;">
    <div class="card-header-row" style="margin-bottom:16px;">
      <a href="admin-rifa.html" class="btn-secundario">Rifa &rarr;</a>
      <a href="admin-doacoes.html" class="btn-secundario">Doações &rarr;</a>
    </div>

    <div class="card">
      <div class="card-header-row">
        <h2>Alunos cadastrados</h2>
        <button type="button" class="btn-secundario" id="btn-relatorio">Imprimir relatório</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="tabela-alunos">
          <thead>
            <tr><th>Nome</th><th>Faixa</th><th>Nascimento</th><th>Telefone aluno</th><th>Responsável</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="5">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <span class="close" id="modal-close">&times;</span>
    <h2 id="modal-titulo">Aluno</h2>
    <div id="modal-corpo"></div>
  </div>
</div>

<div class="only-print" id="relatorio-impressao"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const cardNegado = document.getElementById("card-negado");
const conteudo = document.getElementById("conteudo");
const tabelaAlunos = document.querySelector("#tabela-alunos tbody");
const modalBackdrop = document.getElementById("modal-backdrop");
const modalTitulo = document.getElementById("modal-titulo");
const modalCorpo = document.getElementById("modal-corpo");
const modalClose = document.getElementById("modal-close");
const btnRelatorio = document.getElementById("btn-relatorio");
const relatorioImpressao = document.getElementById("relatorio-impressao");

let alunosCache = [];

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));
modalClose.addEventListener("click", () => modalBackdrop.classList.remove("show"));
btnRelatorio.addEventListener("click", gerarRelatorio);

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const adminDoc = await db.collection("admins").doc(user.uid).get();
  if (!adminDoc.exists) {
    cardNegado.style.display = "block";
    return;
  }

  conteudo.style.display = "block";
  carregarAlunos();
});

function formatarData(iso) {
  if (!iso) return "-";
  const [ano, mes, dia] = iso.split("-");
  return dia + "/" + mes + "/" + ano;
}

// Todos os dados de aluno/responsável vêm do cadastro do próprio aluno (conteúdo
// livre) — nunca colocar em innerHTML. Cada célula/linha é montada via
// createElement/textContent, que escapam qualquer HTML/script automaticamente.
async function carregarAlunos() {
  const snap = await db.collection("alunos").orderBy("nomeCompleto").get();

  if (snap.empty) {
    tabelaAlunos.innerHTML = "<tr><td colspan='5'>Nenhum aluno cadastrado.</td></tr>";
    return;
  }

  alunosCache = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
  tabelaAlunos.innerHTML = "";

  alunosCache.forEach((aluno) => {
    const tr = document.createElement("tr");

    const tdNome = document.createElement("td");
    tdNome.textContent = aluno.nomeCompleto;

    const tdFaixa = document.createElement("td");
    const beltTag = document.createElement("span");
    beltTag.className = "belt-tag";
    beltTag.textContent = aluno.faixa;
    tdFaixa.appendChild(beltTag);

    const tdNascimento = document.createElement("td");
    tdNascimento.textContent = formatarData(aluno.dataNascimento);

    const tdTelefoneAluno = document.createElement("td");
    tdTelefoneAluno.textContent = aluno.telefoneAluno || "-";

    const tdResponsavel = document.createElement("td");
    tdResponsavel.textContent = aluno.nomeResponsavel || "-";

    tr.append(tdNome, tdFaixa, tdNascimento, tdTelefoneAluno, tdResponsavel);
    tr.addEventListener("click", () => abrirDetalhes(aluno));

    tabelaAlunos.appendChild(tr);
  });
}

function linha(container, label, valor) {
  const row = document.createElement("div");
  row.className = "profile-row";
  const spanLabel = document.createElement("span");
  spanLabel.className = "label";
  spanLabel.textContent = label;
  const spanValue = document.createElement("span");
  spanValue.className = "value";
  spanValue.textContent = valor;
  row.append(spanLabel, spanValue);
  container.appendChild(row);
}

function abrirDetalhes(aluno) {
  modalTitulo.textContent = aluno.nomeCompleto;
  modalCorpo.innerHTML = "";

  linha(modalCorpo, "Data de nascimento", formatarData(aluno.dataNascimento));
  linha(modalCorpo, "RG ou CPF", aluno.documentoAluno || "-");
  linha(modalCorpo, "Telefone", aluno.telefoneAluno || "-");
  linha(modalCorpo, "Faixa", aluno.faixa);
  linha(modalCorpo, "E-mail", aluno.email);
  linha(modalCorpo, "Responsável", aluno.nomeResponsavel || "-");
  linha(modalCorpo, "RG ou CPF do responsável", aluno.documentoResponsavel || "-");
  linha(modalCorpo, "Endereço", aluno.enderecoResponsavel);
  linha(modalCorpo, "Telefone do responsável", aluno.telefoneResponsavel || "-");

  const acoes = document.createElement("div");
  acoes.className = "modal-acoes";

  const btnEditar = document.createElement("button");
  btnEditar.type = "button";
  btnEditar.className = "btn-secundario";
  btnEditar.textContent = "Editar cadastro";
  btnEditar.addEventListener("click", () => abrirEdicao(aluno));

  const btnExcluir = document.createElement("button");
  btnExcluir.type = "button";
  btnExcluir.className = "btn-excluir";
  btnExcluir.textContent = "Excluir cadastro";
  btnExcluir.addEventListener("click", () => excluirAluno(aluno));

  acoes.append(btnEditar, btnExcluir);
  modalCorpo.appendChild(acoes);

  modalBackdrop.classList.add("show");
}

function campo(container, label, id, valor, opts) {
  opts = opts || {};
  const lbl = document.createElement("label");
  lbl.setAttribute("for", id);
  lbl.textContent = label;
  const input = document.createElement("input");
  input.type = opts.type || "text";
  input.id = id;
  input.value = valor || "";
  if (opts.required) input.required = true;
  container.append(lbl, input);
  return input;
}

function calcularIdade(dataISO) {
  const hoje = new Date();
  const nascimento = new Date(dataISO + "T00:00:00");
  let idade = hoje.getFullYear() - nascimento.getFullYear();
  const aindaNaoFezAniversario = (hoje.getMonth() < nascimento.getMonth())
    || (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() < nascimento.getDate());
  if (aindaNaoFezAniversario) idade--;
  return idade;
}

function abrirEdicao(aluno) {
  modalTitulo.textContent = "Editar - " + aluno.nomeCompleto;
  modalCorpo.innerHTML = "";

  const form = document.createElement("form");
  form.id = "form-editar-aluno";

  const tituloAluno = document.createElement("p");
  tituloAluno.className = "form-section-title";
  tituloAluno.textContent = "Dados do aluno";
  form.appendChild(tituloAluno);

  const inputNome = campo(form, "Nome completo", "edit-nomeCompleto", aluno.nomeCompleto, { required: true });
  const inputNascimento = campo(form, "Data de nascimento", "edit-dataNascimento", aluno.dataNascimento, { type: "date", required: true });
  const inputDocAluno = campo(form, "RG ou CPF", "edit-documentoAluno", aluno.documentoAluno);
  const inputTelAluno = campo(form, "Telefone", "edit-telefoneAluno", aluno.telefoneAluno);

  const lblFaixa = document.createElement("label");
  lblFaixa.setAttribute("for", "edit-faixa");
  lblFaixa.textContent = "Faixa";
  const selectFaixa = document.createElement("select");
  selectFaixa.id = "edit-faixa";
  ["Branca", "Cinza", "Amarela", "Laranja", "Verde", "Azul", "Roxa", "Marrom", "Preta"].forEach((f) => {
    const opt = document.createElement("option");
    opt.value = f;
    opt.textContent = f;
    if (f === aluno.faixa) opt.selected = true;
    selectFaixa.appendChild(opt);
  });
  form.append(lblFaixa, selectFaixa);

  const tituloResp = document.createElement("p");
  tituloResp.className = "form-section-title";
  tituloResp.textContent = "Dados do pai, mãe ou responsável";
  form.appendChild(tituloResp);

  const inputNomeResp = campo(form, "Nome completo", "edit-nomeResponsavel", aluno.nomeResponsavel);
  const inputDocResp = campo(form, "RG ou CPF", "edit-documentoResponsavel", aluno.documentoResponsavel);
  const inputEndResp = campo(form, "Endereço (rua e número)", "edit-enderecoResponsavel", aluno.enderecoResponsavel, { required: true });
  const inputTelResp = campo(form, "Telefone", "edit-telefoneResponsavel", aluno.telefoneResponsavel);

  function atualizarObrigatoriedade() {
    if (!inputNascimento.value) return;
    const maiorDeIdade = calcularIdade(inputNascimento.value) >= 18;
    inputNomeResp.required = !maiorDeIdade;
    inputDocResp.required = !maiorDeIdade;
    inputTelResp.required = !maiorDeIdade;
  }
  inputNascimento.addEventListener("change", atualizarObrigatoriedade);
  atualizarObrigatoriedade();

  const msgEdicao = document.createElement("div");
  msgEdicao.className = "msg";
  msgEdicao.id = "msg-edicao";

  const acoes = document.createElement("div");
  acoes.className = "modal-acoes";

  const btnSalvar = document.createElement("button");
  btnSalvar.type = "submit";
  btnSalvar.className = "btn";
  btnSalvar.textContent = "Salvar alterações";

  const btnCancelar = document.createElement("button");
  btnCancelar.type = "button";
  btnCancelar.className = "btn-secundario";
  btnCancelar.textContent = "Cancelar";
  btnCancelar.addEventListener("click", () => abrirDetalhes(aluno));

  acoes.append(btnSalvar, btnCancelar);
  form.append(msgEdicao, acoes);
  modalCorpo.appendChild(form);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btnSalvar.disabled = true;
    btnSalvar.textContent = "Salvando...";

    const dadosAtualizados = {
      nomeCompleto: inputNome.value.trim(),
      dataNascimento: inputNascimento.value,
      documentoAluno: inputDocAluno.value.trim(),
      telefoneAluno: inputTelAluno.value.trim(),
      faixa: selectFaixa.value,
      nomeResponsavel: inputNomeResp.value.trim(),
      documentoResponsavel: inputDocResp.value.trim(),
      enderecoResponsavel: inputEndResp.value.trim(),
      telefoneResponsavel: inputTelResp.value.trim(),
      email: aluno.email
    };

    try {
      await db.collection("alunos").doc(aluno.id).update(dadosAtualizados);
      await carregarAlunos();
      abrirDetalhes({ ...aluno, ...dadosAtualizados });
    } catch (err) {
      msgEdicao.textContent = "Não foi possível salvar. Confira os campos obrigatórios.";
      msgEdicao.className = "msg show error";
      btnSalvar.disabled = false;
      btnSalvar.textContent = "Salvar alterações";
    }
  });
}

async function excluirAluno(aluno) {
  if (!confirm("Excluir o cadastro de " + aluno.nomeCompleto + "? Essa ação não pode ser desfeita.")) return;

  await db.collection("alunos").doc(aluno.id).delete();
  modalBackdrop.classList.remove("show");
  await carregarAlunos();
}

function gerarRelatorio() {
  relatorioImpressao.innerHTML = "";

  const titulo = document.createElement("h1");
  titulo.textContent = "Relatório de Alunos - HOS Jiu-Jitsu";
  relatorioImpressao.appendChild(titulo);

  if (alunosCache.length === 0) {
    const p = document.createElement("p");
    p.textContent = "Nenhum aluno cadastrado.";
    relatorioImpressao.appendChild(p);
  } else {
    const p = document.createElement("p");
    p.textContent = "Gerado em " + new Date().toLocaleDateString("pt-BR");
    relatorioImpressao.appendChild(p);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");
    ["Aluno", "Faixa", "Nascimento", "Telefone", "Responsável", "Tel. responsável"].forEach((texto) => {
      const th = document.createElement("th");
      th.textContent = texto;
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    alunosCache.forEach((aluno) => {
      const tr = document.createElement("tr");
      [
        aluno.nomeCompleto,
        aluno.faixa,
        formatarData(aluno.dataNascimento),
        aluno.telefoneAluno || "-",
        aluno.nomeResponsavel || "-",
        aluno.telefoneResponsavel || "-"
      ].forEach((texto) => {
        const td = document.createElement("td");
        td.textContent = texto;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    relatorioImpressao.appendChild(table);
  }

  window.print();
}
</script>
</body>
</html>
